# API-BILLED EXAMPLE: unlike local run_episode.sh, GitHub Actions cannot use the
# machine's ChatGPT subscription login. openai/codex-action@v1 uses OPENAI_API_KEY.
name: daily-ai-podcast-codex

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic dependencies
        run: pip install -r requirements.txt

      - name: Fetch structured sources
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python scripts/fetch_sources.py --hours 48 --out out/sources.json

      - name: Write and validate with Codex (API billed)
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.6-sol
          effort: xhigh
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral", "--strict-config", "--ignore-rules"]'
          prompt: |
            Use the daily-ai-podcast skill to produce today's episode. Work from the
            gathered files already in out/. Select, verify, write, build, and validate.
            Stop before TTS, history mutation, delivery, or publishing.
          output-file: out/codex-final-message.md

      - uses: actions/upload-artifact@v4
        with:
          name: daily-ai-podcast-draft
          path: |
            out/episode.json
            out/episode_meta.json
            out/shownotes.md
            out/script.txt
            out/codex-final-message.md
          if-no-files-found: error
