# Names the Gemini TTS mispronounces, and the spelling to speak instead.
#
# Gemini TTS has no SSML, no <phoneme> tag, and no pronunciation lexicon — the
# only reliable lever is how the word is spelled in the text it reads. So
# make_audio.py rewrites these terms in the transcript it sends to the API,
# right before rendering. Everything else — episode.json, the archived script,
# the published transcript — keeps the normal spelling.
#
#   <term as normally written>: "<respelling to send to the TTS>"
#
# Matching is case-insensitive and bounded by letters, so "Sol" leaves "solved"
# and "solar" alone while "Qwen" still catches "Qwen3-Next". Add entries from
# feedback.md as mispronunciations turn up; if a respelling still sounds wrong,
# tune the spelling and re-render.

Qwen: "Kwen"    # else the TTS spells the Q out: "cue-wen". Rhymes with "Gwen".
                # House pronunciation is the anglicized "kwen", not Mandarin "chwen".
Sol: "Sole"     # OpenAI's top GPT-5.6 tier (Luna/Terra/Sol) — rhymes with "coal"
